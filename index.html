<style>:root{--inspection-green:var(--ok);--inspection-red:var(--danger);--inspection-yellow:var(--warn);--inspection-blue:var(--navy-3);--inspection-soft:var(--bg)}
.inspection-summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}.inspection-summary .stat{padding:16px;min-width:0}.inspection-summary .val{font-size:26px}.inspection-summary .lab{white-space:normal}.inspection-matrix{overflow:auto;border:1px solid var(--border);border-radius:8px;background:var(--card);margin-bottom:24px}.inspection-matrix table{min-width:1540px;table-layout:fixed}.inspection-matrix th:first-child,.inspection-matrix td:first-child{width:250px;position:sticky;left:0;background:var(--card);z-index:2;border-right:1px solid var(--border)}.inspection-matrix th{font-size:11px;white-space:normal}.inspection-matrix td{padding:9px;vertical-align:top}.inspection-cell{width:100%;min-height:75px;padding:10px 6px;border:1px solid currentColor;border-radius:6px;display:flex;flex-direction:column;gap:7px;text-align:center;background:var(--inspection-soft);font-size:11px}.inspection-cell strong{font-size:12px}.inspection-cell.completed{color:var(--inspection-green)}.inspection-cell.overdue{color:var(--inspection-red)}.inspection-cell.upcoming{color:var(--inspection-yellow)}.inspection-cell.future{color:var(--inspection-blue)}.inspection-cell:hover{background:var(--card)}.inspection-project{display:flex;flex-direction:column;gap:5px;overflow-wrap:anywhere;font-size:12px}.inspection-project small{color:var(--muted)}.inspection-alert{color:var(--danger);border:1px solid var(--danger);padding:12px 16px;border-radius:6px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.inspection-queues{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:20px}.inspection-queue h3{font-size:15px;margin-bottom:10px}.inspection-notification{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--border);font-size:12px}.inspection-notification.overdue{color:var(--danger)}.inspection-notification.upcoming{color:var(--warn)}.inspection-queue-list{max-height:230px;overflow:auto}.inspection-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;margin:12px 0}.inspection-legend .completed{color:var(--ok)}.inspection-legend .overdue{color:var(--danger)}.inspection-legend .upcoming{color:var(--warn)}.inspection-legend .future{color:var(--navy-3)}.inspection-photo-list{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.inspection-photo-list img{width:90px;height:75px;object-fit:cover;border-radius:6px}.inspection-photo-list a{display:block}.inspection-contact{color:var(--muted);font-size:12px}.inspection-bell{white-space:nowrap;color:var(--danger);font-size:12px}.inspection-heading{margin:24px 0 12px;font-size:16px}
@media(max-width:1000px){.inspection-summary{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.inspection-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.inspection-queues{grid-template-columns:1fr}.inspection-matrix th:first-child,.inspection-matrix td:first-child{width:180px}.inspection-alert{align-items:flex-start}.inspection-bell{font-size:11px;max-width:110px;white-space:normal}}</style>
<style>
/* ===== Design tokens ===== */
:root{
  --navy:#0f2c5c; --navy-2:#12376f; --navy-3:#1b4a9a;
  --gold:#f5b301; --gold-2:#ffcc33; --orange:#f58a1f;
  --bg:#f5f7fb; --card:#ffffff; --text:#0f2c5c; --muted:#5b6b86;
  --border:#e4e9f2; --danger:#e0364c; --ok:#1aa870; --warn:#f0a419;
  --grad: linear-gradient(135deg,var(--navy) 0%, var(--navy-3) 100%);
  --grad-sun: linear-gradient(135deg,var(--gold) 0%, var(--orange) 100%);
  --shadow: 0 8px 24px rgba(15,44,92,.08);
  --shadow-lg: 0 20px 50px rgba(15,44,92,.15);
  --r: 14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
h1,h2,h3,h4{margin:0;color:var(--navy)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c9d3e6;border-radius:8px}

/* ===== Login ===== */
.login-wrap{min-height:100vh;display:grid;place-items:center;background:var(--grad);padding:20px;position:relative;overflow:hidden}
.login-wrap::before{content:"";position:absolute;inset:-20% -10% auto auto;width:600px;height:600px;background:radial-gradient(circle,var(--gold) 0%,transparent 60%);opacity:.25;filter:blur(20px)}
.login-card{background:#fff;border-radius:20px;padding:40px 34px;width:100%;max-width:420px;box-shadow:var(--shadow-lg);position:relative;z-index:1;animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:20px}
.logo-badge{width:78px;height:78px;border-radius:50%;background:var(--grad-sun);display:grid;place-items:center;box-shadow:0 8px 20px rgba(245,138,31,.35);position:relative}
.logo-badge svg{width:44px;height:44px;color:var(--navy)}
.brand h1{font-size:22px;letter-spacing:.5px}
.brand p{margin:0;color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;background:#fafbfe;transition:.2s;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy-3);background:#fff;box-shadow:0 0 0 3px rgba(27,74,154,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;font-weight:600;font-size:14px;transition:.2s;white-space:nowrap}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(15,44,92,.2)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(15,44,92,.28)}
.btn-gold{background:var(--grad-sun);color:var(--navy)}
.btn-ghost{background:#eef2f9;color:var(--navy)}
.btn-ghost:hover{background:#e2e8f4}
.btn-danger{background:#fde8ec;color:var(--danger)}
.btn-danger:hover{background:#fbd6dc}
.btn-block{width:100%}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
.hint b{color:var(--navy)}

/* ===== App shell ===== */
.app{display:none;min-height:100vh}
.app.on{display:grid;grid-template-columns:260px 1fr}
.sidebar{grid-column:1}
.main{grid-column:2}
.sidebar{background:var(--grad);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;transition:transform .3s}
.side-brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px}
.side-brand .logo-badge{width:42px;height:42px;box-shadow:none}
.side-brand .logo-badge svg{width:24px;height:24px}
.side-brand h2{color:#fff;font-size:15px;letter-spacing:.5px}
.side-brand span{color:var(--gold-2);font-size:10px;letter-spacing:2px;text-transform:uppercase;display:block;margin-top:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#dbe4f5;margin-bottom:2px;font-size:14px;font-weight:500;cursor:pointer;transition:.2s;position:relative}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.active{background:rgba(255,255,255,.14);color:#fff}
.nav a.active::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;background:var(--gold);border-radius:3px}
.nav a svg{width:18px;height:18px;flex-shrink:0}
.nav .sep{padding:14px 12px 6px;color:var(--gold-2);font-size:10px;letter-spacing:2px;text-transform:uppercase;opacity:.75}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:20}
.topbar h1{font-size:20px}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:2px}
.top-actions{display:flex;align-items:center;gap:10px}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search-wrap input{padding:9px 12px 9px 34px;width:240px;border:1.5px solid var(--border);border-radius:10px;background:#fafbfe;outline:none}
.search-wrap input:focus{border-color:var(--navy-3);background:#fff}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--grad-sun);color:var(--navy);display:grid;place-items:center;font-weight:700;cursor:pointer}
.hamburger{display:none;padding:8px;border-radius:8px;background:#eef2f9}
.hamburger svg{width:20px;height:20px;color:var(--navy)}

.content{padding:24px;flex:1}
.page{display:none;animation:fadeIn .3s}
.page.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== Cards & grids ===== */
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.stat{background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:.25s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.stat .lab{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .val{font-size:30px;font-weight:800;color:var(--navy);margin-top:6px;line-height:1}
.stat .foot{font-size:12px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px}
.stat .icon{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--grad-sun)}
.stat .icon svg{width:18px;height:18px;color:var(--navy)}
.stat.navy .icon{background:var(--grad)}
.stat.navy .icon svg{color:#fff}

.card{background:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.card-h h3{font-size:15px}
.card-h .sub{font-size:12px;color:var(--muted)}

.two-col{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media (max-width:960px){.two-col{grid-template-columns:1fr}}

/* ===== Tables ===== */
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;background:#fff;min-width:640px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
th{background:#f7f9fd;color:var(--muted);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.5px;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfe}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px}
.b-ok{background:#dcf5e8;color:#0f7a4a}
.b-pend{background:#fff2d9;color:#a06600}
.b-no{background:#fde8ec;color:#a11d31}
.b-info{background:#e2ecff;color:#1b4a9a}
.b-gold{background:#fff5cc;color:#7a5a00}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* ===== Forms & toolbar ===== */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.toolbar .search-wrap input{width:280px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
@media (max-width:600px){.form-grid{grid-template-columns:1fr}.topbar .search-wrap{display:none}}


/* ===== Mobile polish ===== */
@media (max-width:700px){
  .content{padding:12px}
  .topbar{padding:10px 14px}
  .topbar h1{font-size:17px}
  .topbar .sub{display:none}
  .toolbar{gap:8px}
  .toolbar .search-wrap{display:block;width:100%;order:3}
  .toolbar .search-wrap input{width:100%}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{padding:14px}
  .stat .val{font-size:24px}
  .stat .lab{padding-right:34px;font-size:10px;letter-spacing:1px}
  .stats .stat:last-child:nth-child(odd){grid-column:1/-1}
  .stat .icon{width:30px;height:30px;top:10px;right:10px}
  .card{padding:14px}
  .tbl-wrap:has(table.mcards){border:none;overflow:visible;border-radius:0}
  table.mcards{min-width:0;background:transparent}
  table.mcards thead{display:none}
  table.mcards,table.mcards tbody,table.mcards tr,table.mcards td{display:block;width:100%}
  table.mcards tr{background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
  table.mcards td{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border:none;padding:6px 0;text-align:right;word-break:break-word}
  table.mcards td::before{content:attr(data-label);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;text-align:left;flex-shrink:0;padding-top:2px}
  table.mcards td[data-label=""]{justify-content:flex-end}
  table.mcards td[data-label=""]::before{display:none}
  table.mcards tr:hover td{background:none}
  .modal-bg{padding:0;align-items:flex-end}
  .modal{max-height:92vh;border-radius:16px 16px 0 0}
  .modal-b{padding:16px}
  .modal-h,.modal-f{padding:14px 16px}
  .toast{left:12px;right:12px;bottom:16px;text-align:center}
}

/* ===== Modal ===== */
.modal-bg{position:fixed;inset:0;background:rgba(15,44,92,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;backdrop-filter:blur(4px)}
.modal-bg.on{display:flex;animation:fadeIn .2s}
.modal{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:fadeUp .3s}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:1}
.modal-h h3{font-size:17px}
.modal-h .x{width:32px;height:32px;border-radius:8px;background:#f0f3fa;display:grid;place-items:center}
.modal-b{padding:20px 22px}
.modal-f{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}

/* ===== Toast ===== */
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow-lg);z-index:200;display:none;animation:fadeUp .3s;font-size:14px;font-weight:500}
.toast.on{display:block}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--danger)}

/* ===== Charts ===== */
.chart-box{position:relative;height:260px}
.chart-box canvas{width:100%;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend .dot{width:10px;height:10px}

/* Access denied */
.denied{background:#fff;border-radius:var(--r);padding:60px 20px;text-align:center;box-shadow:var(--shadow)}
.denied svg{width:56px;height:56px;color:var(--danger);margin-bottom:10px}

/* Responsive */
@media (max-width:900px){
  .app.on{grid-template-columns:minmax(0,1fr)}
  .main{grid-column:1}
  .sidebar{position:fixed;left:0;top:0;z-index:50;width:260px;transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:var(--shadow-lg)}
  .hamburger{display:grid}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none}
  .backdrop.on{display:block}
  .content{padding:16px}
  .topbar{padding:12px 16px}
  .topbar h1{font-size:17px}
  .search-wrap input{width:160px}
}
@media (max-width:520px){
  .stat .val{font-size:24px}
  .search-wrap{display:none}
  .modal{border-radius:12px}
}

/* Print */
@media print{
  .sidebar,.topbar,.toolbar,.no-print{display:none!important}
  .app.on{grid-template-columns:1fr}
  .content{padding:0}
  .card{box-shadow:none;border:1px solid #ccc}
  body{background:#fff}
}

/* Profile grid */
.profile-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.profile-head .avatar-lg{width:88px;height:88px;font-size:32px;border-radius:50%;background:var(--grad-sun);color:var(--navy);display:grid;place-items:center;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:#eef2f9;color:var(--navy);padding:5px 10px;border-radius:20px;font-size:12px;font-weight:500}

/* Perm matrix */
.perm-tbl label{display:flex;align-items:center;gap:6px;color:var(--navy);font-size:13px}
.perm-tbl input{accent-color:var(--navy-3);width:16px;height:16px}

/* Static-hosting backend: everything is stored in this browser's localStorage */
const DB_KEY='scope_solar_db_v1', SES_KEY='scope_solar_sessions_v1';
function _loadDB(){
  try{ const d=JSON.parse(localStorage.getItem(DB_KEY)); if(d&&Array.isArray(d.users)&&d.users.length) return d; }catch(e){}
  let d=JSON.parse(JSON.stringify(DEFAULT_STATE)); delete d.session;
  try{ const r=seed(d); if(r&&r.users) d=r; }catch(e){}
  _saveDB(d); return d;
}
function _saveDB(d){ localStorage.setItem(DB_KEY,JSON.stringify(d)); }
function _ses(){ try{return JSON.parse(localStorage.getItem(SES_KEY))||{};}catch(e){return {};} }
async function api(p){
  const err=(m,s)=>Object.assign(new Error(m),{status:s});
  const db=_loadDB();
  if(p.action==='login'){
    const k=String(p.username||p.email||'').trim().toLowerCase();
    const u=db.users.find(u=>(String(u.username||'').toLowerCase()===k)||(String(u.email||'').toLowerCase()===k));
    if(!u||u.pass!==p.pass||u.active===false) throw err('Invalid username or password',401);
    const t=Math.random().toString(36).slice(2)+Date.now().toString(36);
    const m=_ses(); m[t]=u.id; localStorage.setItem(SES_KEY,JSON.stringify(m));
    return {token:t,uid:u.id,state:db};
  }
  const uid=_ses()[p.token];
  if(p.action==='logout'){ const m=_ses(); delete m[p.token]; localStorage.setItem(SES_KEY,JSON.stringify(m)); return {}; }
  if(uid===undefined) throw err('Session expired',401);
  if(p.action==='load') return {state:db,uid};
  if(p.action==='save'){
    const ns=p.state||{}; delete ns.session;
    (ns.users||[]).forEach(u=>{ if(u.newPass){ u.pass=u.newPass; } delete u.newPass; });
    _saveDB(ns); return {};
  }
  if(p.action==='changePw'){
    const u=db.users.find(x=>x.id===uid);
    if(!u||u.pass!==p.current) throw err('Current password is wrong',400);
    u.pass=p.next; _saveDB(db); return {};
  }
  throw err('Unknown action',400);
}
let _saveTimer=null, _saving=Promise.resolve();
function save(){
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{
    const token=localStorage.getItem(TOKEN_KEY); if(!token) return;
    const st=Object.assign({},S); delete st.session;
    _saving=api({action:'save',token,state:st}).catch(e=>{ toast('Not saved: '+e.message,'err'); if(e.status===401) logout(); });
  },300);
}

function permLevel(u,mod){ if(!u) return 0; if(u.role==='Admin') return 2; if(mod==='profile') return 2; if(u.perms&&u.perms[mod]!=null) return +u.perms[mod]; return (ROLE_PERMS[u.role]||{})[mod]?2:0; }

/* ---------- Image + time helpers ---------- */
function resizeImage(file,max,q){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{ const img=new Image();
      img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const w=Math.round(img.width*k),h=Math.round(img.height*k);
        const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); res(c.toDataURL('image/jpeg',q)); };
      img.onerror=rej; img.src=r.result; };
    r.onerror=rej; r.readAsDataURL(file);
  });
}
function fmtTime(t){ if(!t) return ''; const [h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; return ((h%12)||12)+':'+String(m).padStart(2,'0')+' '+ap; }

  const pendingV = S.videos.filter(v=>!v.published).length;
  const totalP = S.photos.reduce((a,p)=>a+(p.count||1),0);

  return {totalV,editedV,publishedV,pendingV,totalP,sitesCovered};

}

/* ---------- Charts (vanilla canvas) ---------- */
function fitCanvas(c){
  const dpr=window.devicePixelRatio||1;
  const r=c.getBoundingClientRect();
  c.width=r.width*dpr; c.height=r.height*dpr;
  const ctx=c.getContext('2d'); ctx.scale(dpr,dpr);
  return {ctx,w:r.width,h:r.height};
}
function drawLineChart(canvas, series, labels){
  const {ctx,w,h}=fitCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  const pad={l:34,r:12,t:14,b:26};
  const cw=w-pad.l-pad.r, ch=h-pad.t-pad.b;
  const max=Math.max(1,...series.flatMap(s=>s.data));
  // grid
  ctx.strokeStyle='#eef2f9'; ctx.lineWidth=1; ctx.font='11px sans-serif'; ctx.fillStyle='#5b6b86';
  for(let i=0;i<=4;i++){
    const y=pad.t+ch*i/4; ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+cw,y); ctx.stroke();
    ctx.fillText(Math.round(max-(max*i/4)), 4, y+3);
  }
  const n=labels.length;
  labels.forEach((l,i)=>{ if(i%Math.ceil(n/7)===0){ const x=pad.l+cw*i/(n-1); ctx.fillText(l,x-10,h-8); }});
  series.forEach(s=>{
    ctx.strokeStyle=s.color; ctx.lineWidth=2.5; ctx.beginPath();
    s.data.forEach((v,i)=>{ const x=pad.l+cw*i/(n-1); const y=pad.t+ch-(v/max)*ch; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
    ctx.stroke();
    // area
    ctx.lineTo(pad.l+cw,pad.t+ch); ctx.lineTo(pad.l,pad.t+ch); ctx.closePath();
    const g=ctx.createLinearGradient(0,pad.t,0,pad.t+ch); g.addColorStop(0,s.color+'55'); g.addColorStop(1,s.color+'00');
    ctx.fillStyle=g; ctx.fill();
    // dots
    ctx.fillStyle=s.color; s.data.forEach((v,i)=>{ const x=pad.l+cw*i/(n-1); const y=pad.t+ch-(v/max)*ch; ctx.beginPath(); ctx.arc(x,y,2.5,0,Math.PI*2); ctx.fill();});
  });
}
function drawBarChart(canvas, labels, data, color='#1b4a9a'){
  const {ctx,w,h}=fitCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  const pad={l:34,r:12,t:14,b:36}, cw=w-pad.l-pad.r, ch=h-pad.t-pad.b;
  const max=Math.max(1,...data);
  ctx.strokeStyle='#eef2f9'; ctx.font='11px sans-serif'; ctx.fillStyle='#5b6b86';
  for(let i=0;i<=4;i++){ const y=pad.t+ch*i/4; ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+cw,y); ctx.stroke(); ctx.fillText(Math.round(max-(max*i/4)),4,y+3);}
  const bw=cw/labels.length*.55;
  labels.forEach((l,i)=>{
    const x=pad.l+cw*(i+.5)/labels.length - bw/2;
    const bh=(data[i]/max)*ch;
    const g=ctx.createLinearGradient(0,pad.t+ch-bh,0,pad.t+ch); g.addColorStop(0,color); g.addColorStop(1,color+'88');
    ctx.fillStyle=g;
    const y=pad.t+ch-bh;
    ctx.beginPath();
    const r=6;
    ctx.moveTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.lineTo(x+bw-r,y); ctx.arcTo(x+bw,y,x+bw,y+r,r);
    ctx.lineTo(x+bw,pad.t+ch); ctx.lineTo(x,pad.t+ch); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#5b6b86'; ctx.textAlign='center'; ctx.fillText(l.length>10?l.slice(0,10)+'…':l, x+bw/2, h-16);
    ctx.fillStyle='#0f2c5c'; ctx.font='bold 11px sans-serif'; ctx.fillText(data[i], x+bw/2, y-4); ctx.font='11px sans-serif';
    ctx.textAlign='left';
  });
}
function drawDoughnut(canvas, data, colors, labels){
  const {ctx,w,h}=fitCanvas(canvas);
  ctx.clearRect(0,0,w,h);
  const cx=w/2, cy=h/2-6, R=Math.min(w,h)*.38, r=R*.6;
  const total=data.reduce((a,b)=>a+b,0)||1;
  let ang=-Math.PI/2;
  data.forEach((v,i)=>{
    const a2=ang+(v/total)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,ang,a2); ctx.closePath(); ctx.fillStyle=colors[i%colors.length]; ctx.fill();
    ang=a2;
  });
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  ctx.fillStyle='#0f2c5c'; ctx.font='bold 20px sans-serif'; ctx.textAlign='center'; ctx.fillText(total,cx,cy);
  ctx.fillStyle='#5b6b86'; ctx.font='11px sans-serif'; ctx.fillText('Total',cx,cy+16);
  // legend
  ctx.textAlign='left'; ctx.font='11px sans-serif';
  const legY=h-8-labels.length*14;
  labels.forEach((l,i)=>{ ctx.fillStyle=colors[i%colors.length]; ctx.fillRect(8,legY+i*14,10,10); ctx.fillStyle='#0f2c5c'; ctx.fillText(l+' ('+data[i]+')',22,legY+i*14+9);});
}
function drawDashboardCharts(){
  // 14-day series
  const days=14, labels=[], vids=[], edited=[], pub=[];
  for(let i=days-1;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    labels.push(d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}));
    vids.push(S.videos.filter(v=>v.date===ds).length);
    edited.push(S.videos.filter(v=>v.editing && v.date===ds).length);
    pub.push(S.videos.filter(v=>v.published && v.date===ds).length);
  }
  const ct=el('chTrend'); if(ct) drawLineChart(ct, [{data:vids,color:'#1b4a9a'},{data:edited,color:'#f5b301'},{data:pub,color:'#f58a1f'}], labels);
  const cs=el('chSites'); if(cs){
    const data=S.sites.map(s=>S.videos.filter(v=>v.siteId===s.id).length);
    drawDoughnut(cs, data, ['#0f2c5c','#f5b301','#f58a1f','#1b4a9a','#1aa870','#e0364c'], S.sites.map(s=>s.name.split(' ')[0]));
  }
}

async function addPFiles(inp){
  const files=[...inp.files]; if(!files.length) return;
  toast('Processing '+files.length+' photo(s)...');
  for(const f of files){ try{ _pImgs.push(await resizeImage(f,1024,.65)); }catch(e){} }
  inp.value=''; drawPPrev();
}
function photoForm(id){
  const p= id ? S.photos.find(x=>x.id===id) : {title:'',date:new Date().toISOString().slice(0,10),siteId:'',notes:'',count:1};
  _pImgs=(p.images||[]).slice();
  openModal(id?'Edit Album':'Add Photo Album',`
    <div class="form-grid">
      <div class="field full"><label>Photo / Album Title *</label><input id="p_title" value="${esc(p.title)}" required/></div>
      <div class="field"><label>Date</label><input id="p_date" type="date" value="${p.date}"/></div>
      <div class="field"><label>Project Site (optional)</label><select id="p_site"><option value="">— No project site —</option>${S.sites.map(s=>`<option value="${s.id}" ${s.id==p.siteId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Number of Photos</label><input id="p_count" type="number" min="1" value="${p.count||1}"/></div>
      <div class="field full"><label>Upload Photos</label><input id="p_files" type="file" accept="image/*" multiple onchange="addPFiles(this)"/><div id="p_prev" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"></div></div>
      <div class="field full"><label>Notes</label><textarea id="p_notes" rows="2">${esc(p.notes)}</textarea></div>
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="savePhoto(${id||0})">${id?'Update':'Save'} Album</button>`);
  drawPPrev();
}
function savePhoto(id){
  const title=el('p_title').value.trim(); if(!title){toast('Title required','err');return;}
  const data={title,date:el('p_date').value,siteId:el('p_site').value?+el('p_site').value:'',notes:el('p_notes').value,count:_pImgs.length||+el('p_count').value||1,images:_pImgs.slice()};
  if(id){ Object.assign(S.photos.find(x=>x.id===id),data); toast('Album updated'); } else { S.photos.push({id:uid(),...data}); toast('Album added'); }
  if(data.siteId && !pFilter.site) pFilter.site=String(data.siteId);
  save(); closeModal(); renderPhotos();
}
function delPhoto(id){ if(!confirm('Delete this album?')) return; S.photos=S.photos.filter(p=>p.id!==id); save(); renderPhotos(); toast('Deleted'); }

function siteCalledToggle(on){ if(on && !el('s_cdate').value) el('s_cdate').value=new Date().toISOString().slice(0,10); }
function saveSite(id){
  const n=el('s_name').value.trim(); if(!n){toast('Name required','err');return;}
  const called=el('s_called').checked, kwv=el('s_kw').value.trim(), today=new Date().toISOString().slice(0,10);

    sms:el('s_sms').checked,called,callDate:called?(el('s_cdate').value||today):el('s_cdate').value,callTime:el('s_ctime').value};
  if(id){ Object.assign(S.sites.find(x=>x.id===id),data); toast('Project updated'); } else { S.sites.push({id:uid(),...data}); toast('Project added'); }
  save(); closeModal(); show('sites');
}
function delSite(id){ if(!confirm('Delete this site? Videos and photos linked to it will keep the reference but show —')) return; S.sites=S.sites.filter(s=>s.id!==id); save(); show('sites'); toast('Deleted'); }

      <tbody>${S.team.map(t=>{const u=userOf(t);return `<tr><td><strong>${esc(t.name)}</strong></td>${PERM_MODS.map(m=>{const l=u?permLevel(u,m):0;return `<td style="text-align:center">${l===2?'<span style="color:var(--ok)">✎</span>':l===1?'<span style="color:var(--navy-3)">👁</span>':'<span style="color:var(--danger)">✕</span>'}</td>`;}).join('')}</tr>`;}).join('')}</tbody>

function teamForm(id){
  const t = id ? S.team.find(x=>x.id===id) : {name:'',role:'Viewer',email:'',phone:'',active:true};
  const u = id ? userOf(t) : null;
  const lvl = m => u ? permLevel(u,m) : (m==='dashboard'?1:0);
  openModal(id?'Edit Member':'Add Team Member',`
    <div class="form-grid">
      <div class="field"><label>Full Name *</label><input id="t_name" value="${esc(t.name)}"/></div>
      <div class="field"><label>Role</label><select id="t_role">${ROLES.map(r=>`<option ${r===t.role?'selected':''}>${r}</option>`).join('')}</select></div>
      <div class="field"><label>Username * (login name — anything, e.g. 1234)</label><input id="t_user" autocapitalize="none" placeholder="e.g. ali or 1234" value="${esc((u&&(u.username||u.email))||t.username||'')}"/></div>
      <div class="field"><label>Phone</label><input id="t_phone" value="${esc(t.phone||'')}"/></div>
      <div class="field full"><label>${id?'New Password (leave empty to keep)':'Password *'}</label><input id="t_pass" value=""/></div>
      <div class="field full"><label>Access (per section)</label><table class="perm-tbl" style="width:100%">${PERM_MODS.map(m=>`<tr><td style="text-transform:capitalize;padding:4px 0">${m}</td>${[[0,'No access'],[1,'View only'],[2,'View + Add/Edit']].map(([v,l])=>`<td><label><input type="radio" name="pm_${m}" value="${v}" ${lvl(m)===v?'checked':''}/> ${l}</label></td>`).join('')}</tr>`).join('')}</table>
      <div style="font-size:11px;color:var(--muted);margin-top:4px">Admin role always has full access.</div></div>
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveTeam(${id||0})">Save Member</button>`);
}
function saveTeam(id){
  const name=el('t_name').value.trim(),username=el('t_user').value.trim().toLowerCase(),pass=el('t_pass').value;
  if(!name||!username){toast('Name & username required','err');return;}
  if(!id && pass.length<4){toast('Password: at least 4 characters','err');return;}
  if(pass && pass.length<4){toast('Password: at least 4 characters','err');return;}
  const role=el('t_role').value, phone=el('t_phone').value;
  const perms={}; PERM_MODS.forEach(m=>{ const r=document.querySelector(`input[name="pm_${m}"]:checked`); perms[m]=r?+r.value:0; });
  const t = id ? S.team.find(x=>x.id===id) : null;
  const existing = t ? userOf(t) : null;
  const clash = S.users.find(u=>u!==existing && ((u.username||'').toLowerCase()===username || (u.email||'').toLowerCase()===username));
  if(clash){toast('Username already taken','err');return;}
  if(t){
    Object.assign(t,{name,role,phone,username});
    if(existing){ Object.assign(existing,{name,role,username,perms}); if(pass) existing.newPass=pass; }
    else S.users.push({id:t.id,name,email:'',username,pass,role,designation:role,perms,active:true});
  } else {
    const nid=uid();
    S.team.push({id:nid,name,role,email:'',phone,username,active:true});
    S.users.push({id:nid,name,email:'',username,pass,role,designation:role,perms,active:true});
  }
  save(); closeModal(); show('team'); toast(t?'Team member updated':'Team member added');
}
function toggleAccess(id){
  const t=S.team.find(x=>x.id===id); const u=userOf(t);
  if(u){ if(u.id===S.session.uid){toast("You can't revoke yourself",'err');return;} u.active=!u.active; toast(u.active?'Access granted':'Access revoked'); }
  else { toast('Edit the member and set a username & password first','err'); return; }
  save(); show('team');
}
function delTeam(id){ if(!confirm('Remove member?')) return; const t=S.team.find(x=>x.id===id); S.team=S.team.filter(x=>x.id!==id); const du=userOf(t); if(du&&du.id===S.session.uid){toast("You can't remove yourself",'err');S.team.push(t);return;} S.users=S.users.filter(u=>u!==du||u.role==='Admin'); save(); show('team'); toast('Removed'); }



/* label table cells so they can turn into cards on phones */
function labelTables(root){
  root.querySelectorAll('table:not(.perm-tbl)').forEach(t=>{
    const ths=[...t.querySelectorAll('thead th')].map(h=>h.textContent.trim());
    if(!ths.length) return;
    t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>td.setAttribute('data-label',ths[i]||'')));
    t.classList.add('mcards');
  });
}
new MutationObserver(()=>labelTables(el('content'))).observe(document.getElementById('content'),{childList:true,subtree:true});

/* ---------- PROJECTS = PROJECT SITES (one list) ---------- */
function PR(){ return S.sites; }
function migrateProjects(){
  if(S.projects && S.projects.length){ S.projects.forEach(p=>S.sites.push({id:p.id,name:p.name,client:p.client||'',kw:p.kw,date:p.date,location:p.location||'',notes:p.notes||'',sms:false,called:false,callDate:'',callTime:''})); S.projects=[]; save(); }
}
function monthKey(d){ return (d||'').slice(0,7)||'0000-00'; }
function monthLabel(k){ if(k==='0000-00') return 'No date'; return new Date(k+'-01T00:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'}); }
function mapUrl(loc){
  loc=(loc||'').trim(); if(!loc) return '';
  if(/^https?:\/\//i.test(loc)) return loc;
  if(/^(www\.|maps\.|goo\.gl|maps\.app\.goo\.gl)/i.test(loc)) return 'https://'+loc;
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(loc);
}
let prFilter={q:''};
function monthSummary(){
  const m={}; PR().forEach(p=>{ const k=monthKey(p.date); (m[k]=m[k]||{n:0,kw:0}); m[k].n++; m[k].kw+=(+p.kw||0); });
  return Object.keys(m).sort().reverse().map(k=>({key:k,label:monthLabel(k),n:m[k].n,kw:+m[k].kw.toFixed(2)}));
}
function pageSites(){
  migrateProjects();
  const list=PR(); const kw=list.reduce((a,p)=>a+(+p.kw||0),0);
  const nowK=new Date().toISOString().slice(0,7); const thisM=list.filter(p=>monthKey(p.date)===nowK);
  return `
  <div class="toolbar">
    <button class="btn btn-primary" onclick="siteForm()">${I.plus} Add Project</button>
    <div class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input placeholder="Search project, client..." value="${esc(prFilter.q)}" oninput="prFilter.q=this.value;renderSites()"/></div>
    <button class="btn btn-ghost" onclick="dlProjectsXlsx()">${I.down} Excel</button>
    <button class="btn btn-ghost" onclick="dlProjectsPdf()">${I.down} PDF</button>
  </div>
  <div class="grid stats" style="margin-bottom:16px">
    ${statCard('Total Projects',list.length,'All time','site',true)}
    ${statCard('Total Capacity',+kw.toFixed(2)+' kW','All projects','dash')}
    ${statCard('This Month',thisM.length,monthLabel(nowK),'report')}
  </div>
  <div id="prSummary"></div>
  <div id="siteCards"></div>`;
}
function renderSites(){
  const ms=monthSummary();
  el('prSummary').innerHTML = ms.length ? `<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Month-wise</h3></div>
    <div class="tbl-wrap"><table><thead><tr><th>Month</th><th>Projects</th><th>Total kW</th></tr></thead><tbody>
    ${ms.map(x=>`<tr><td><strong>${x.label}</strong></td><td>${x.n}</td><td>${x.kw} kW</td></tr>`).join('')}
    </tbody></table></div></div>` : '';
  let list=PR().slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(prFilter.q){ const q=prFilter.q.toLowerCase(); list=list.filter(p=>((p.name||'')+(p.client||'')+(p.notes||'')).toLowerCase().includes(q)); }
  el('siteCards').innerHTML = list.length ? `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${list.map(s=>{
    const vc=S.videos.filter(v=>v.siteId===s.id).length, pc=S.photos.filter(p=>p.siteId===s.id).reduce((a,p)=>a+(p.count||1),0), u=mapUrl(s.location);
    return `<div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div style="width:44px;height:44px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;flex-shrink:0">${I.site}</div>
        <div style="min-width:0"><h4 style="font-size:15px;word-break:break-word">${esc(s.name)}</h4><div style="font-size:12px;color:var(--muted);margin-top:2px">${esc(s.client||'No client name')}</div></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
        <span class="badge b-gold">⚡ ${s.kw!==''&&s.kw!=null?esc(s.kw)+' kW':'— kW'}</span>
        <span class="badge b-info">${fmtDate(s.date)}</span>
        ${u?`<a href="${esc(u)}" target="_blank" rel="noopener" class="badge b-ok" style="text-decoration:none">📍 Open map</a>`:''}
      </div>
      <div style="display:flex;gap:20px;margin-bottom:12px">
        <div><div style="font-size:22px;font-weight:800;color:var(--navy)">${vc}</div><div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Videos</div></div>
        <div><div style="font-size:22px;font-weight:800;color:var(--navy)">${pc}</div><div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Photos</div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">
        <span class="badge ${s.sms?'b-ok':'b-no'}" style="align-self:flex-start">${s.sms?'✓ SMS sent':'✕ SMS not sent'}</span>
        <span class="badge ${s.called?'b-ok':'b-no'}" style="align-self:flex-start">${s.called?'✓ Called us'+(s.callDate?' • '+fmtDate(s.callDate):'')+(s.callTime?' • '+fmtTime(s.callTime):''):'✕ Not called yet'}</span>
      </div>
      ${s.notes?`<div style="font-size:12px;color:var(--muted);margin-bottom:12px">${esc(s.notes)}</div>`:''}
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost" style="flex:1;padding:6px" onclick="siteForm(${s.id})">${I.edit} Edit</button>
        <button class="btn btn-danger" style="padding:6px 10px" onclick="delSite(${s.id})">${I.trash}</button>
      </div>
    </div>`;}).join('')}</div>` : emptyState('No projects yet','Tap "Add Project" to add your first one.');

/* --- Excel (.xlsx) writer, no libraries --- */
const _crcT=(()=>{ const t=[]; for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=_crcT[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  files.forEach(f=>{
    const nb=enc.encode(f.name), d=enc.encode(f.data), crc=crc32(d);
    const lh=new DataView(new ArrayBuffer(30)); lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true); lh.setUint16(10,0,true); lh.setUint16(12,33,true); lh.setUint32(14,crc,true); lh.setUint32(18,d.length,true); lh.setUint32(22,d.length,true); lh.setUint16(26,nb.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nb,d);
    const ch=new DataView(new ArrayBuffer(46)); ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,33,true); ch.setUint32(16,crc,true); ch.setUint32(20,d.length,true); ch.setUint32(24,d.length,true); ch.setUint16(28,nb.length,true); ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nb);
    off+=30+nb.length+d.length;
  });
  const csz=central.reduce((a,x)=>a+x.length,0);
  const end=new DataView(new ArrayBuffer(22)); end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,csz,true); end.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function xmlEsc(v){ return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,''); }
function colL(i){ let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
function sheetXml(rows,widths,boldRows){
  const body=rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((v,ci)=>{
    const ref=colL(ci)+(ri+1), st=boldRows.includes(ri)?' s="1"':'';
    if(v===''||v==null) return '';
    if(typeof v==='number') return `<c r="${ref}"${st}><v>${v}</v></c>`;
    return `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
  }).join('')+'</row>').join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${body}</sheetData></worksheet>`;
}

<script>(function(root){
  const months=[1,3,6,9,12,15,18,21,24];
  function validDate(value){return typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value)&&!Number.isNaN(Date.parse(value))&&new Date(value+'T00:00:00Z').toISOString().slice(0,10)===value;}
  function addMonths(date,n){if(!validDate(date))return '';const [y,m,d]=date.split('-').map(Number);const last=new Date(Date.UTC(y,m-1+n+1,0));const result=new Date(Date.UTC(last.getUTCFullYear(),last.getUTCMonth(),Math.min(d,last.getUTCDate())));return result.toISOString().slice(0,10);}
  function status(record,today){if(record.status==='done')return 'completed';if(!record.dueDate)return 'missing';if(record.dueDate<today)return 'overdue';const days=(Date.parse(record.dueDate)-Date.parse(today))/86400000;return days<=14?'upcoming':'future';}
  function schedule(sites,records){return sites.flatMap(site=>validDate(site.installationDate)?months.map((month,i)=>{const previous=records.find(x=>String(x.siteId)===String(site.id)&&x.number===i+1)||{};return {...previous,siteId:site.id,number:i+1,month,dueDate:addMonths(site.installationDate,month)};}):[]);}
  root.InspectionRules={months,validDate,addMonths,status,schedule};
})(globalThis);</script>

.ir-head svg{width:44px;height:44px;color:#0b2d6b;flex:none}
.ir-head h2{margin:0;font-size:24px;font-weight:800;color:#0b2d6b;line-height:1.15}
.ir-head p{margin:2px 0 0;color:#475569;font-size:14px}
.ir-actions{display:flex;gap:10px;margin-bottom:12px}
.ir-add{flex:1.1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 10px;background:linear-gradient(135deg,#0b2d6b,#123f8f);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;box-shadow:0 6px 14px rgba(11,45,107,.25)}
.ir-proj{flex:1;display:flex;align-items:center;gap:6px;background:#e6efff;border-radius:14px;padding:0 12px;font-weight:700;color:#0b2d6b;font-size:14px;min-width:0}
.ir-proj select{border:0;background:transparent;font-weight:700;color:#0b2d6b;font-size:14px;outline:0;flex:1;min-width:0;padding:13px 0;width:100%}
.ir-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.ir-stat{border-radius:14px;padding:14px 10px;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.12);text-align:center}
.ir-stat svg{width:38px;height:38px;flex:none}
.ir-stat b{display:block;font-size:28px;line-height:1}.ir-stat span{display:block;font-size:12.5px;font-weight:600;line-height:1.2;margin-top:3px}
.ir-stat.total{background:linear-gradient(135deg,#0b2d6b,#1349a8)}.ir-stat.up{background:linear-gradient(135deg,#ffb300,#ff9800)}.ir-stat.over{background:linear-gradient(135deg,#ef4444,#d71f2f)}
.ir-tabs{display:grid;grid-template-columns:repeat(4,auto);gap:8px;margin-bottom:14px}
.ir-tab{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 6px;border-radius:14px;border:1px solid #dbe5f7;background:#eef3fd;color:#0b2d6b;font-weight:600;font-size:14px;cursor:pointer}
.ir-tab.on{background:#0b2d6b;color:#fff;border-color:#0b2d6b}
.ir-tab i{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:800;color:#fff;flex:none}
.ir-tab svg{width:18px;height:18px}
.ir-search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #dbe5f7;border-radius:14px;padding:11px 14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(15,23,42,.05)}
.ir-search input{border:0;outline:0;flex:1;font-size:15px;background:transparent;min-width:0}
.ir-search button{border:0;background:none;color:#0b2d6b;font-size:20px;line-height:1;cursor:pointer;padding:0 4px}
.ir-card{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 3px 12px rgba(15,23,42,.08);cursor:pointer;border:1px solid #eef2f9}
.ir-card:active{transform:scale(.99)}

.ir-sep{width:1px;align-self:stretch;background:#d9e2f2;flex:none}
.ir-main{flex:1;min-width:0}
.ir-main h3{margin:0;font-size:16px;line-height:1.2;color:#0b2d6b;font-weight:800;word-break:break-word}
.ir-main small{display:block;color:#64748b;font-size:13px;margin:2px 0 4px}
.ir-cnt{display:flex;align-items:center;gap:6px;color:#1d4ed8;font-weight:700;font-size:13px}.ir-cnt svg{width:16px;height:16px}
.ir-side{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:none}
.ir-date{display:flex;align-items:center;justify-content:center;gap:6px;background:#e6eefc;color:#0b2d6b;border-radius:999px;padding:6px 10px;font-weight:700;font-size:12.5px;white-space:nowrap}.ir-date svg{width:15px;height:15px}
.ir-pill{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:6px 10px;font-weight:700;font-size:12.5px;white-space:nowrap}
.ir-pill i{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:800;color:#fff;flex:none}
.ir-pill.completed{background:#d9f7e3;color:#15803d}.ir-pill.completed i{background:#16a34a}
.ir-pill.overdue{background:#ffe1e1;color:#d71f2f}.ir-pill.overdue i{background:#e11d2e}
.ir-pill.upcoming{background:#e3edff;color:#1d4ed8}.ir-pill.upcoming i{background:#1d4ed8}
.ir-pill.future{background:#eef1f6;color:#475569}.ir-pill.future i{background:#94a3b8}
.ir-chev{color:#0b2d6b;font-size:26px;line-height:1;flex:none}
.ir-back{display:inline-flex;align-items:center;gap:6px;border:0;background:#e6efff;color:#0b2d6b;font-weight:700;border-radius:12px;padding:9px 14px;margin-bottom:12px;cursor:pointer;font-size:14px}
.ir-detail{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 3px 12px rgba(15,23,42,.08);flex-wrap:wrap}
.ir-detail .ir-thumb{width:96px;height:70px}
.ir-detail h3{margin:0;font-size:19px;color:#0b2d6b}
.ir-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ir-row{display:flex;align-items:center;gap:14px;background:#fff;margin-bottom:10px;padding:12px 14px;border-radius:14px;border:1px solid #eef2f9;box-shadow:0 2px 8px rgba(15,23,42,.05);width:100%;text-align:left;cursor:pointer}
.ir-row .cal{width:28px;height:28px;color:#1d4ed8;flex:none}.ir-row .cal svg{width:100%;height:100%}
.ir-row .id{min-width:96px;border-right:2px solid #d9e2f2;padding-right:12px}
.ir-row .id b{display:block;color:#0b2d6b;font-size:15px}.ir-row .id span{color:#64748b;font-size:13px}
.ir-row .ir-pill{margin-left:auto}
.ir-auto{font-size:12px;color:#64748b;margin:4px 0 12px}
.ir-empty{background:#fff;border-radius:14px;padding:22px;text-align:center;color:#64748b}
.ir-due-h{font-weight:800;color:#0b2d6b;font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px}
.ir-pick{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:6px;cursor:pointer}
.ir-pick input{width:18px;height:18px;flex:none}
.ir-pick-search{display:flex;align-items:center;gap:8px;background:#f1f5fc;border:1px solid #dbe5f7;border-radius:12px;padding:8px 12px;margin-bottom:8px}.ir-pick-search svg{width:16px;height:16px;flex:none}.ir-pick-search input{border:0;outline:0;background:transparent;flex:1;font-size:14px;min-width:0}
.ir-pick small{display:block;color:#64748b}
@media(max-width:400px){.ir-pl{display:none}.ir-thumb{width:54px;height:48px}.ir-card{gap:8px}.ir-date,.ir-pill{padding:5px 7px}}
@media(max-width:600px){
  .ir-cnt{white-space:nowrap}
  .ir-head h2{font-size:21px}.ir-head svg{width:38px;height:38px}
  .ir-add{flex:1.5;white-space:nowrap;font-size:12.5px;padding:12px 6px}.ir-proj{font-size:12.5px;padding:0 8px}.ir-proj select{font-size:12.5px}
  .ir-stat{flex-direction:column;gap:4px;padding:12px 6px}.ir-stat svg{width:30px;height:30px}.ir-stat b{font-size:24px}.ir-stat span{font-size:11.5px;margin-top:0}
  .ir-stat{justify-content:flex-start;padding-top:14px;min-height:118px}.ir-stat>div{display:flex;flex-direction:column;align-items:center}.ir-stat span{min-height:28px}
  .ir-tab{font-size:12px;padding:10px 4px;gap:4px}.ir-tab i{width:17px;height:17px;font-size:10px}
  .ir-card{gap:9px;padding:10px}
  .ir-thumb{width:62px;height:52px}
  .ir-main h3{font-size:14.5px}.ir-main small{font-size:12px}.ir-cnt{font-size:12px}
  .ir-date,.ir-pill{font-size:11px;padding:5px 8px}
  .ir-chev{font-size:22px}
  .ir-row{gap:10px;padding:10px}.ir-row .id{min-width:78px;padding-right:8px}
}

<script>
(function(){
const ic={
 cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18M7 13h2M11 13h2M15 13h2M7 17h2M11 17h2"/></svg>',
 clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 alert:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#fff"/><path d="M12 6v8M12 17.5v.5" stroke="#e11d2e" stroke-width="3" stroke-linecap="round"/></svg>',
 rec:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18"/><circle cx="8.5" cy="13" r=".9" fill="currentColor"/><circle cx="12" cy="13" r=".9" fill="currentColor"/><circle cx="15.5" cy="13" r=".9" fill="currentColor"/><circle cx="8.5" cy="17" r=".9" fill="currentColor"/><circle cx="12" cy="17" r=".9" fill="currentColor"/></svg>',
 grid:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="9.5" y="3" width="5" height="5" rx="1"/><rect x="16" y="3" width="5" height="5" rx="1"/><rect x="3" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><rect x="16" y="9.5" width="5" height="5" rx="1"/><rect x="3" y="16" width="5" height="5" rx="1"/><rect x="9.5" y="16" width="5" height="5" rx="1"/><rect x="16" y="16" width="5" height="5" rx="1"/></svg>',
 search:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0b2d6b" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>'
};
window.irState=window.irState||{site:'all',detail:null};
const dshort=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';
const lab={completed:'Completed',overdue:'Overdue',upcoming:'Upcoming',future:'Scheduled'};
const mark={completed:'✓',overdue:'!',upcoming:'◷',future:'•'};

/* AUTOMATIC: installation date falls back to the project date, so every project gets its 9 inspections without extra typing */
window.effInstall=function(p){ return InspectionRules.validDate(p.installationDate)?p.installationDate:(InspectionRules.validDate(p.date)?p.date:''); };
scheduledVisits=function(){ return InspectionRules.schedule(PR().map(p=>({...p,installationDate:effInstall(p)})),serviceReports()); };
trackerSummary=function(){ return ''; };

function projState(rows){
  const by=s=>rows.filter(x=>visitStatus(x)===s).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  for(const s of ['overdue','upcoming','future']){ const r=by(s)[0]; if(r) return {s,x:r,date:r.dueDate}; }
  const last=rows.slice().sort((a,b)=>(a.actualDate||a.dueDate).localeCompare(b.actualDate||b.dueDate)).pop();
  return last?{s:'completed',x:last,date:last.actualDate||last.dueDate}:null;
}
const pill=(s)=>`<span class="ir-pill ${s}"><i>${mark[s]}</i>${lab[s]}</span>`;

pageInspection=function(){ return '<div class="ir-wrap" id="trackerPanel"></div>'; };
renderInspection=function(){ renderTracker(); };

window.irOpen=function(id){ irState.detail=id; renderTracker(); window.scrollTo(0,0); };
window.irBack=function(){ irState.detail=null; renderTracker(); };

function irList(){
  const box=el('irList'); if(!box) return;
  const visits=scheduledVisits(), q=(trackerFilter.q||'').toLowerCase(), st=trackerFilter.status;
  const sites=PR().filter(p=>irState.site==='all'||String(p.id)===String(irState.site))
    .filter(p=>[p.name,p.client,p.area,p.block,p.location,p.phone].join(' ').toLowerCase().includes(q));
  const cards=sites.map(p=>{
    let rows=visits.filter(x=>String(x.siteId)===String(p.id));
    if(st!=='all') rows=rows.filter(x=>visitStatus(x)===st);
    const ps=projState(rows); if(!ps) return '';
    return `<div class="ir-card" onclick="irOpen(${p.id})"><div class="ir-thumb"></div><div class="ir-sep"></div>
      <div class="ir-main"><h3>${esc(p.name)}</h3><small>Client: ${esc(p.client||'—')}</small><div class="ir-cnt">${ic.cal}${rows.length} Inspection${rows.length===1?'':'s'}</div></div>
      <div class="ir-side"><span class="ir-date">${ic.cal}${dshort(ps.date)}</span>${pill(ps.s)}</div><span class="ir-chev">›</span></div>`;
  }).join('');
  box.innerHTML=cards||'<div class="ir-empty">No matching projects</div>';
}
window.irSearch=function(v){ trackerFilter.q=v; irList(); const b=el('irClear'); if(b) b.style.display=v?'':'none'; };
window.irClear=function(){ trackerFilter.q=''; const i=el('irQ'); if(i){ i.value=''; i.focus(); } irSearch(''); };

renderTracker=function(){
  const target=el('trackerPanel'); if(!target) return;
  if(irState.detail!=null){ return irDetail(target); }
  const visits=scheduledVisits(), all=PR(), st=trackerFilter.status;
  const scope=irState.site==='all'?visits:visits.filter(x=>String(x.siteId)===String(irState.site));
  const cnt=s=>scope.filter(x=>visitStatus(x)===s).length;
  const tab=(k,label,icon)=>`<button class="ir-tab ${st===k?'on':''}" onclick="trackerFilter.status='${k}';renderTracker()">${icon}${label}</button>`;
  target.innerHTML=`
  <div class="ir-head">${ic.rec}<div><h2>Inspection Record</h2><p>Track all your inspection schedules</p></div></div>
  <div class="ir-actions">
    ${canEdit('inspection')?`<button class="ir-add" onclick="irOpenAdd()">＋ Add to Today's Inspection</button>`:''}
    <label class="ir-proj"><span class="ir-pl">Project:</span> <select aria-label="Project" onchange="irState.site=this.value;renderTracker()"><option value="all">All Sites</option>${all.map(p=>`<option value="${p.id}" ${String(irState.site)===String(p.id)?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
  </div>
  <div class="ir-stats">
    <div class="ir-stat total">${ic.cal}<div><b>${scope.length}</b><span>Total<br>Inspections</span></div></div>
    <div class="ir-stat up">${ic.clock}<div><b>${cnt('upcoming')}</b><span>Upcoming<br>(14 Days)</span></div></div>
    <div class="ir-stat over">${ic.alert}<div><b>${cnt('overdue')}</b><span>Overdue</span></div></div>
  </div>
  <div class="ir-tabs">${tab('all','All',ic.grid)}${tab('completed','Completed','<i style="background:#16a34a">✓</i>')}${tab('overdue','Overdue','<i style="background:#e11d2e">!</i>')}${tab('upcoming','Upcoming','<i style="background:#1d4ed8">◷</i>')}</div>
  <div class="ir-search">${ic.search}<input id="irQ" aria-label="Search projects" placeholder="Search project, client..." value="${esc(trackerFilter.q)}" oninput="irSearch(this.value)"/><button id="irClear" onclick="irClear()" style="${trackerFilter.q?'':'display:none'}" aria-label="Clear">✕</button></div>
  <div id="irList"></div>`;
  irList();
};

function irDetail(target){
  const p=PR().find(x=>String(x.id)===String(irState.detail)); if(!p){ irState.detail=null; return renderTracker(); }
  const rows=scheduledVisits().filter(x=>String(x.siteId)===String(p.id)), ps=projState(rows), u=mapUrl(p.location);
  const auto=!InspectionRules.validDate(p.installationDate);
  target.innerHTML=`
  <button class="ir-back" onclick="irBack()">‹ Back</button>
  <div class="ir-detail"><div class="ir-thumb"></div>
    <div style="flex:1;min-width:150px"><h3>${esc(p.name)}</h3><div style="color:#64748b;font-size:13px">Client: ${esc(p.client||'—')}${p.phone?' · '+esc(p.phone):''}</div>
      <div class="ir-meta">${ps?pill(ps.s):''}<span class="ir-date">${ic.cal}Installed ${dshort(effInstall(p))}</span>${p.kw!==''&&p.kw!=null?`<span class="ir-date">⚡ ${esc(p.kw)} kW</span>`:''}${u?`<a class="ir-date" href="${esc(u)}" target="_blank" rel="noopener" style="text-decoration:none">📍 Open map</a>`:''}</div>
    </div>
    ${canEdit('sites')?`<button class="btn btn-ghost" onclick="editInstallation(${p.id})">Change installation date</button>`:''}
  </div>
  <div class="ir-auto">${auto?'Installation date is taken automatically from the project date. ':''}The 9 inspections (1, 3, 6, 9, 12, 15, 18, 21 and 24 months) are scheduled automatically — tap one to add notes, photos and mark it done.</div>
  ${rows.map(x=>{ const s=visitStatus(x); return `<button class="ir-row" onclick="openServiceReport(${p.id},${x.number})"><span class="cal">${ic.cal}</span><div class="id"><b>INS# ${x.number}</b><span>${x.month} month${x.month===1?'':'s'}</span></div><div><b style="color:#0b2d6b;font-size:14px">${dshort(s==='completed'&&x.actualDate?x.actualDate:x.dueDate)}</b></div>${pill(s)}<span class="ir-chev">›</span></button>`; }).join('')}`;
}

/* "Add to Today's Inspection" — due / overdue projects are pre-selected automatically */
window.irOpenAdd=function(){
  const t=todayStr(), visits=scheduledVisits();
  const info=PR().map(p=>{ const ps=projState(visits.filter(x=>String(x.siteId)===String(p.id))); return {p,ps,inList:!!insFor(p.id,t)}; });
  const due=info.filter(i=>i.ps&&(i.ps.s==='overdue'||i.ps.s==='upcoming')&&!i.inList), rest=info.filter(i=>!due.includes(i));
  const row=(i,chk)=>`<label class="ir-pick" data-t="${esc((i.p.name+' '+(i.p.client||'')).toLowerCase())}"><input type="checkbox" class="ir-chk" value="${i.p.id}" ${chk?'checked':''} ${i.inList?'disabled':''}/><div style="flex:1;min-width:0"><b>${esc(i.p.name)}</b><small>${esc(i.p.client||'—')}${i.ps?' · '+lab[i.ps.s]+' '+dshort(i.ps.date):''}</small></div>${i.inList?'<span class="badge b-ok">In today\'s list</span>':''}</label>`;
  openModal("Add to Today's Inspection",
    `<div class="ir-pick-search">${ic.search}<input id="irPickQ" placeholder="Search project..." oninput="irPickFilter(this.value)" autocomplete="off"/></div>
    <div id="irPickList">`+
    (due.length?`<div class="ir-sec"><div class="ir-due-h">Due or overdue (selected automatically)</div>${due.map(i=>row(i,true)).join('')}</div>`:'')+
    `<div class="ir-sec"><div class="ir-due-h">Other projects</div>${rest.map(i=>row(i,false)).join('')||'<div class="ir-empty">No other projects</div>'}</div>
    <div id="irPickNone" class="ir-empty" style="display:none">No matching project</div></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="irConfirmAdd()">Add selected</button>`);
};
window.irPickFilter=function(v){
  v=(v||'').trim().toLowerCase(); let any=false;
  document.querySelectorAll('#irPickList .ir-sec').forEach(sec=>{
    let vis=0; sec.querySelectorAll('.ir-pick').forEach(r=>{ const m=!v||r.dataset.t.includes(v); r.style.display=m?'':'none'; if(m) vis++; });
    sec.style.display=vis||!sec.querySelector('.ir-pick')?'':'none'; if(vis) any=true;
  });
  const n=el('irPickNone'); if(n) n.style.display=any?'none':'';
};
window.irConfirmAdd=function(){
  const ids=[...document.querySelectorAll('.ir-chk:checked:not(:disabled)')].map(c=>c.value);
  if(!ids.length){ toast('Select at least one project','err'); return; }
  closeModal(); insAdd(ids);
};

/* AUTOMATIC: marking a site done in Daily Inspection completes its nearest due inspection in the Inspection Record */
const _insDone=insDone;
insDone=function(id){
  _insDone(id);
  const x=INS().find(i=>i.id===id); if(!x) return;
  const recs=serviceReports();
  if(x.status==='done'){
    if(recs.some(r=>r.autoFromIns===id)) return;
    const cand=scheduledVisits().filter(v=>String(v.siteId)===String(x.siteId)&&['overdue','upcoming'].includes(visitStatus(v))).sort((a,b)=>a.dueDate.localeCompare(b.dueDate))[0];
    if(!cand) return;
    S.serviceInspections=recs.filter(r=>!(String(r.siteId)===String(cand.siteId)&&r.number===cand.number)).concat({...cand,siteId:cand.siteId,number:cand.number,actualDate:x.date,status:'done',notes:x.notes||cand.notes||'',doneAt:x.doneAt,doneBy:x.doneBy,doneByName:x.doneByName,autoFromIns:id});
    save(); toast('Inspection INS# '+cand.number+' marked completed automatically');
  } else {
    const before=recs.length; S.serviceInspections=recs.filter(r=>r.autoFromIns!==id);
    if(S.serviceInspections.length!==before) save();
  }
  if(typeof refreshInspectionBell==='function') refreshInspectionBell();
};
})();
</script>

<style>
/* ===== Compact inspection bell (fixes cut-off header on phones) ===== */
.top-actions{flex:none;gap:10px}
.topbar>div:first-child{min-width:0}
.topbar h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;display:inline-flex;align-items:center;gap:8px;border:1px solid #dbe5f7;background:#eef3fd;color:#0b2d6b;border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.ib svg{width:20px;height:20px;flex:none}
.ib-badge{min-width:20px;height:20px;border-radius:10px;background:#1d4ed8;color:#fff;font-size:11px;font-weight:800;display:inline-grid;place-items:center;padding:0 6px}
.ib-badge.red{background:#e11d2e}
@media(max-width:700px){
  .ib{padding:8px 9px}.ib-txt{display:none}
  .ib-badge{position:absolute;top:-6px;right:-6px;border:2px solid #fff;min-width:19px;height:19px}
  .topbar{gap:8px}.topbar h1{font-size:16px}
  .topbar>div:first-child{gap:10px!important}
}
/* ===== Bottom navigation (members with limited access, phones) ===== */
.bn,.bn-sheet,.bn-bg{display:none}
@media(max-width:900px){
  body.bnav .bn{display:flex}
  body.bnav .hamburger{display:none!important}
  body.bnav .content{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
  body.bnav .toast{bottom:92px}
  body.bnav .bn-bg{display:block;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;opacity:0;pointer-events:none;transition:.2s}
  body.bnav .bn-bg.on{opacity:1;pointer-events:auto}
  body.bnav .bn-sheet{display:block;position:fixed;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:22px 22px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s;box-shadow:0 -10px 40px rgba(15,23,42,.2)}
  body.bnav .bn-sheet.on{transform:none}
}
.bn{position:fixed;left:0;right:0;bottom:0;z-index:45;background:#fff;border-top:1px solid #e2e8f4;box-shadow:0 -6px 20px rgba(15,23,42,.08);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
.bn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 4px;border:0;background:none;color:#7a8aa5;font-size:10.5px;font-weight:600;position:relative;cursor:pointer;min-width:0;font-family:inherit}
.bn button svg{width:23px;height:23px}
.bn button span.l{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bn button.on{color:#0b2d6b}
.bn button.on::before{content:"";position:absolute;top:-7px;width:30px;height:3px;border-radius:0 0 4px 4px;background:#f5b301}
.bn .bn-b{position:absolute;top:1px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:#e11d2e;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.bn-sheet .grab{width:42px;height:4px;border-radius:2px;background:#d5dcea;margin:0 auto 12px}
.bn-sheet h4{margin:0 0 12px;font-size:15px;color:#0b2d6b}
.bn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bn-grid button{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border:1px solid #e2e8f4;background:#f6f8fd;border-radius:14px;color:#0b2d6b;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
.bn-grid button.on{background:#0b2d6b;color:#fff;border-color:#0b2d6b}
.bn-grid svg{width:26px;height:26px}
.bn-grid .bn-b{position:absolute;top:6px;right:8px;min-width:17px;height:17px;border-radius:9px;background:#e11d2e;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
</style>
<script>
(function(){
const P={
 dashboard:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
 videos:'<rect x="2" y="5" width="14" height="14" rx="3"/><path d="M16 10l6-3v10l-6-3z"/>',
 photos:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/>',
 sites:'<path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
 inspection:'<rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M9 3v2h6V3M9 13l2 2 4-4"/>',
 daily:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 9h18M9 15l2 2 4-4"/>',
 publishing:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/>',
 team:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14.3c2.2.6 3.5 2.4 3.5 5.2"/>',
 reports:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/>',
 more:'<circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/>',
 bell:'<path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/>'
};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${P[k]}</svg>`;
const SHORT={dashboard:'Home',videos:'Videos',photos:'Photos',sites:'Sites',inspection:'Inspection',daily:'Daily',publishing:'Publish',team:'Team',reports:'Reports',profile:'Profile'};
const FULL={dashboard:'Dashboard',videos:'Videos',photos:'Photos',sites:'Project Sites',inspection:'Inspection Record',daily:'Daily Inspection',publishing:'Social Publishing',team:'Team',reports:'Reports',profile:'My Profile'};

/* Compact bell: icon + count, full text only on large screens */
refreshInspectionBell=function(){
  const avatar=el('topAvatar'); if(!avatar||!can('inspection')) return;
  let bell=el('inspection_bell');
  if(!bell){ bell=document.createElement('button'); bell.id='inspection_bell'; bell.className='ib'; bell.onclick=openInspectionNotifications; avatar.before(bell); }
  const c=trackerCounts();
  bell.innerHTML=`${svg('bell')}<span class="ib-txt">Pending ${c.pending} · Overdue ${c.overdue}</span><span class="ib-badge ${c.overdue?'red':''}">${c.overdue||c.pending}</span>`;
  bell.setAttribute('aria-label',`Inspection notifications: ${c.pending} pending, ${c.overdue} overdue`);
  bnBadge();
};

/* Bottom navigation: only for members who are not Admin; shows only the modules they can access */
function bnItems(){ return Object.keys(SHORT).filter(id=>id==='profile'||can(id)); }
function bnGo(id){ bnSheet(false); if(id==='videos') goVideos('pending'); else if(id==='photos') goPhotos(); else show(id); }
window.bnGo=bnGo;
window.bnSheet=function(on){ const a=el('bnSheet'),b=el('bnBg'); if(!a) return; a.classList.toggle('on',on); b.classList.toggle('on',on); };
function overdueN(){ try{ return can('inspection')?trackerCounts().overdue:0; }catch(e){ return 0; } }
function bnBadge(){
  const n=overdueN();
  document.querySelectorAll('[data-bn="inspection"] .bn-b,[data-bn="more"] .bn-b').forEach(b=>{ b.textContent=n; b.style.display=n?'':'none'; });
}
window.renderBottomNav=function(){
  const u=currentUser(); const need=!!u&&u.role!=='Admin';
  document.body.classList.toggle('bnav',need);
  let bar=el('bn'); if(!need){ if(bar){ bar.remove(); el('bnSheet')?.remove(); el('bnBg')?.remove(); } return; }
  const mods=bnItems().filter(x=>x!=='profile');
  const barIds=mods.length<=4?mods:mods.slice(0,3), more=mods.length<=4?[]:mods.slice(3);
  const btn=(id,cls)=>`<button data-bn="${id}" class="${cls||''}" onclick="bnGo('${id}')" aria-label="${FULL[id]}">${svg(id)}<span class="l">${SHORT[id]}</span>${id==='inspection'?'<i class="bn-b" style="display:none"></i>':''}</button>`;
  if(!bar){ bar=document.createElement('nav'); bar.id='bn'; bar.className='bn'; bar.setAttribute('aria-label','Main navigation'); document.body.appendChild(bar);
    const bg=document.createElement('div'); bg.id='bnBg'; bg.className='bn-bg'; bg.onclick=()=>bnSheet(false); document.body.appendChild(bg);
    const sh=document.createElement('div'); sh.id='bnSheet'; sh.className='bn-sheet'; document.body.appendChild(sh); }
  bar.innerHTML=barIds.map(id=>btn(id)).join('')+(more.length?`<button data-bn="more" onclick="bnSheet(true)" aria-label="More">${svg('more')}<span class="l">More</span>${more.includes('inspection')?'<i class="bn-b" style="display:none"></i>':''}</button>`:'')+btn('profile');
  el('bnSheet').innerHTML=`<div class="grab"></div><h4>More</h4><div class="bn-grid">${more.map(id=>`<button data-bn="${id}" onclick="bnGo('${id}')">${svg(id)}<span>${FULL[id]}</span>${id==='inspection'?'<i class="bn-b" style="display:none"></i>':''}</button>`).join('')}</div>`;
  bnActive(currentPage); bnBadge();
};
function bnActive(id){
  const inMore=!!document.querySelector(`#bnSheet [data-bn="${id}"]`);
  document.querySelectorAll('#bn button').forEach(b=>b.classList.toggle('on',b.dataset.bn===id||(inMore&&b.dataset.bn==='more')));
  document.querySelectorAll('#bnSheet button').forEach(b=>b.classList.toggle('on',b.dataset.bn===id));
}
const _show=show;
show=function(id){ _show(id); try{ bnActive(id); window.scrollTo(0,0); }catch(e){} };
const _boot=bootApp;
bootApp=function(){ _boot(); renderBottomNav(); };
/* members without a sidebar need a way to sign out: add it to the profile page */
const _pp=pageProfile;
pageProfile=function(){ return _pp()+(document.body.classList.contains('bnav')?`<div class="card" style="margin-top:14px"><button class="btn btn-ghost btn-block" onclick="logout()">Sign out</button></div>`:''); };
})();
</script>
</body>
